    <style>
        body { background-color: #2c2c2c; color: #00ff00; font-family: Arial; }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
            margin: 20px auto;
            width: fit-content;
        }
        .table-title {
            color: #ffffff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            padding: 5px;
            background-color: #3a3a3a;
            border-radius: 5px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th {
            position: sticky;
            top: 0;
            background-color: #2c2c2c;
            color: #ffffff;
            padding: 8px;
            border: 1px solid #444;
            z-index: 2;
        }
        td {
            text-align: center;
            padding: 8px;
            background-color: #2c2c2c;
            color: #00ff00;
            border: 1px solid #444;
        }
        td.coin-name {
            color: #ffffff !important;
            font-weight: bold;
        }
        /* Navigation buttons styles */
        .navigation {
            margin: 15px auto;
            padding: 10px;
            text-align: center;
        }
        .nav-button {
            display: inline-block;
            background-color: #3a3a3a;
            color: #e0e0e0;
            padding: 8px 15px;
            margin: 0 5px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .nav-button:hover {
            background-color: #444;
        }
    </style>
</head>
