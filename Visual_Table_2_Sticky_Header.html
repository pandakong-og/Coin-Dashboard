<!DOCTYPE html>

<head>
    <meta charset='UTF-8'>
    <title>Visual Table</title>
    <style>
        body { background-color: #2c2c2c; color: #00ff00; font-family: Arial; }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
            margin: 20px auto;
            width: fit-content;
        }
        .table-title {
            color: #ffffff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            padding: 5px;
            background-color: #3a3a3a;
            border-radius: 5px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th {
            position: sticky;
            top: 0;
            background-color: #2c2c2c;
            color: #ffffff;
            padding: 8px;
            border: 1px solid #444;
            z-index: 2;
        }
        /* Special styling for OB/OS columns */
        th.ob-column {
            background-color: #3c2c2c; /* Red tint for OB (Overbought) columns */
            border-right: 1px solid #555;
        }
        th.os-column {
            background-color: #2c3c2c; /* Green tint for OS (Oversold) columns */
            border-left: 1px solid #555;
        }
        /* Add a thicker border for the last OB column to create separation */
        th.ob-column:last-of-type, td.ob-cell:last-of-type {
            border-right: 3px solid #555;
        }
        /* Add a thicker border for the first OS column to create separation */
        th.os-column:first-of-type, td.os-cell:first-of-type {
            border-left: 3px solid #555;
        }
        td {
            text-align: center;
            padding: 8px;
            background-color: #2c2c2c;
            color: #00ff00;
            border: 1px solid #444;
        }
        /* Special styling for OB/OS cells to match headers */
        td.ob-cell {
            background-color: #302c24; /* Darker red background for OB (Overbought) cells */
        }
        td.os-cell {
            background-color: #2c3024; /* Darker green background for OS (Oversold) cells */
        }
        /* Column group headers */
        .col-group {
            text-align: center;
            padding: 5px;
            font-weight: bold;
            color: #ffffff;
            border-bottom: 1px solid #444;
        }
        .ob-group {
            background-color: #3c2c2c;
        }
        .os-group {
            background-color: #2c3c2c;
        }
        td.coin-name {
            color: #ffffff !important;
            font-weight: bold;
            text-align: left;
            /* Keep coin name visible when scrolling horizontally */
            position: sticky;
            left: 0;
            background-color: #2c2c2c;
            z-index: 1;
        }
        /* Navigation buttons styles */
        .navigation {
            margin: 15px auto;
            padding: 10px;
            text-align: center;
        }
        .nav-button {
            display: inline-block;
            background-color: #3a3a3a;
            color: #e0e0e0;
            padding: 8px 15px;
            margin: 0 5px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .nav-button:hover {
            background-color: #444;
        }
        /* Legend for Table 2 */
        .legend {
            margin: 10px 0;
            color: #aaa;
            font-size: 12px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .legend-color {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 5px;
            border-radius: 3px;
        }
        .ob-legend {
            background-color: #3c2c2c; /* Red tint for Overbought */
        }
        .os-legend {
            background-color: #2c3c2c; /* Green tint for Oversold */
        }
    </style>
</head>
